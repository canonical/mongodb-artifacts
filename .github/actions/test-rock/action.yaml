name: Test rock
description: Set up Rockcraft and LXD, then run spread tests.

inputs:
  rock-name:
    description: Rock name used for log artifact naming.
    required: true
  rock-path:
    description: Path to the rock directory.
    required: true
  runner:
    description: Runner label used for log artifact naming.
    required: true

runs:
  using: composite
  steps:
    # Charmed tests bootstrap Kubernetes on the runner. Slim tests need Docker.
    - name: Purge Docker (GitHub hosted, charmed rock)
      if: >-
        ${{ inputs.rock-name == 'charmed-mongodb' &&
            runner.environment != 'self-hosted' }}
      shell: bash
      run: |
        sudo timeout 240s apt-get remove --purge -y \
          docker-ce docker-ce-cli containerd.io docker.io containerd \
          2>/dev/null || true
        sudo nft flush ruleset
        sudo ip link delete docker0 2>/dev/null || true

    - name: Purge Docker (self hosted, charmed rock)
      if: >-
        ${{ inputs.rock-name == 'charmed-mongodb' &&
            runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        sudo timeout 180s apt-get purge -y docker.io containerd \
          2>/dev/null || true
        sudo timeout 60s apt-get autoremove -y 2>/dev/null || true
        for chain in DOCKER DOCKER-ISOLATION-STAGE-1 \
          DOCKER-ISOLATION-STAGE-2 DOCKER-USER DOCKER-FORWARD; do
          sudo iptables -D FORWARD -j "$chain" 2>/dev/null || true
          sudo iptables -F "$chain" 2>/dev/null || true
          sudo iptables -X "$chain" 2>/dev/null || true
          sudo iptables -t nat -F "$chain" 2>/dev/null || true
          sudo iptables -t nat -X "$chain" 2>/dev/null || true
        done
        sudo iptables -P FORWARD ACCEPT

    - name: Remove Podman CNI bridge config (charmed rock)
      if: ${{ inputs.rock-name == 'charmed-mongodb' }}
      shell: bash
      run: sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist

    - name: Install Rockcraft
      shell: bash
      run: sudo snap install rockcraft --classic

    - name: Set up LXD
      uses: canonical/setup-lxd@v0.1.2

    - name: Allow runner to use LXD
      shell: bash
      run: sudo usermod --append --groups lxd "$USER"

    # `rockcraft test` packs the rock and runs the spread suites against it.
    # Fail if no spread.yaml is found.
    - name: Run spread tests
      shell: bash
      env:
        ROCK_NAME: ${{ inputs.rock-name }}
      working-directory: ${{ inputs.rock-path }}
      run: |
        if [ ! -f spread.yaml ]; then
          echo "No spread.yaml in ${{ inputs.rock-path }}; failing."
          exit 1
        fi
        if [ "$ROCK_NAME" = charmed-mongodb ]; then
          sg lxd -c \
            "rockcraft test craft:ubuntu-24.04:spread/tests/replica-set" \
            || exit "$?"
          sg lxd -c \
            "rockcraft test craft:ubuntu-24.04:spread/tests/sharding"
        else
          sg lxd -c "rockcraft test"
        fi

    - name: Rockcraft logs
      if: ${{ success() || failure() }}
      shell: bash
      run: cat ~/.local/state/rockcraft/log/* || true

    - name: Upload Rockcraft logs
      if: ${{ success() || failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: rockcraft-logs-${{ inputs.rock-name }}-${{ inputs.runner }}
        path: ~/.local/state/rockcraft/log/*
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload spread diagnostics
      if: ${{ success() || failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: spread-diagnostics-${{ inputs.rock-name }}-${{ inputs.runner }}
        path: ${{ inputs.rock-path }}/spread-logs/**
        if-no-files-found: ignore
        retention-days: 14
