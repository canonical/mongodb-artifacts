name: Publish rocks to GHCR

env:
  RELEASE: edge

on:
  workflow_call:
  workflow_dispatch:

jobs:
  discover-rocks:
    uses: ./.github/workflows/rocks-discover.yaml

  build:
    name: Build rock | ${{ matrix.rock.name }}
    needs: discover-rocks
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v49.0.2
    with:
      path-to-rock-directory: ${{ matrix.rock.path }}
      artifact-prefix: ${{ matrix.rock.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read

  test:
    name: Test rock | ${{ matrix.rock.name }} | ${{ matrix.runner }}
    needs:
      - discover-rocks
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
        runner:
          - ubuntu-24.04       # amd64
          - ubuntu-24.04-arm   # arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up LXD
        uses: canonical/setup-lxd@v0.1.2

      - name: Install Rockcraft
        run: sudo snap install rockcraft --classic

      # `rockcraft test` packs the rock and runs the spread suites against it
      # (craft backend). Skip rocks that do not define spread tests.
      - name: Run spread tests
        working-directory: ${{ matrix.rock.path }}
        run: |
          if [ ! -f spread.yaml ]; then
            echo "No spread.yaml in ${{ matrix.rock.path }}; failing."
            exit 1
          fi
          rockcraft test

      - name: Rockcraft logs
        if: ${{ success() || failure() }}
        run: cat ~/.local/state/rockcraft/log/* || true

  publish:
    name: Release rock  | ${{ matrix.rock.name }}
    needs:
      - discover-rocks
      - build
      - test
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v49.0.2
    with:
      path-to-rock-directory: ${{ matrix.rock.path }}
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      actions: read  # Needed for GitHub API call to get workflow version
      packages: write  # Needed to publish to GitHub Container Registry
      contents: write  # Needed to create git tags
