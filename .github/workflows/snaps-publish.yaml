name: Publish Snap

on:
  workflow_call:
  workflow_dispatch:

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build:
    name: Build snap | ${{ matrix.snap.name }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v56.0.0
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    permissions:
      contents: read

  publish:
    name: Publish Snap | ${{ matrix.snap.name }}
    needs:
      - discover-snaps
      - build
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_edge.yaml@v56.0.0
    with:
      track: 8
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      contents: write  # Needed to create git tags
