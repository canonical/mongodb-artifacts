name: Cleanup PR snap branches

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-pr-snap-branches:
    name: Close PR snap branches
    runs-on: ubuntu-latest
    env:
      SNAP_CHANNEL: 8/edge/pr-${{ github.event.pull_request.number }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Skip without Snap Store credentials
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::notice::SNAP_STORE_TOKEN_EDGE is not available; skipping PR snap branch cleanup."

      - name: Install snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: sudo snap install snapcraft --classic

      - name: Close PR snap branches
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          set -euo pipefail

          mapfile -t snaps < <(
            find . -path '*/snap/snapcraft.yaml' \
              | sed 's#/snap/snapcraft.yaml##' \
              | xargs -r -n1 basename
          )

          if [ "${#snaps[@]}" -eq 0 ]; then
            echo "No snaps discovered; nothing to close."
            exit 0
          fi

          failures=0
          for snap in "${snaps[@]}"; do
            echo "Checking ${snap} on ${SNAP_CHANNEL}"
            if ! revisions=$(snapcraft revisions "${snap}"); then
              echo "::warning::Failed to list revisions for ${snap}"
              failures=1
              continue
            fi

            if ! awk -v channel="${SNAP_CHANNEL}" '
              NR > 1 {
                for (i = 5; i <= NF; i++) {
                  channel_name = $i
                  gsub(/\*/, "", channel_name)
                  split(channel_name, channels, ",")
                  for (j in channels) {
                    if (channels[j] == channel) {
                      found = 1
                    }
                  }
                }
              }
              END { exit !found }
            ' <<<"${revisions}"; then
              echo "No open ${SNAP_CHANNEL} branch found for ${snap}; skipping."
              continue
            fi

            echo "Closing ${SNAP_CHANNEL} for ${snap}"
            if ! snapcraft close "${snap}" "${SNAP_CHANNEL}"; then
              echo "::warning::Failed to close ${SNAP_CHANNEL} for ${snap}"
              failures=1
            fi
          done

          exit "${failures}"
