name: Rocks Trivy rock security scanner
on:
  push:
    branches:
      - 8-24.04
  pull_request:
  workflow_dispatch:

jobs:
  discover-rocks:
    uses: ./.github/workflows/rocks-discover.yaml
  build:
    name: Build rock | ${{ matrix.rock.name }}
    needs: discover-rocks
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v49.0.2
    with:
      path-to-rock-directory: ${{ matrix.rock.path }}
      artifact-prefix: ${{ matrix.rock.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read
  scan:
    name: Trivy scan | ${{ matrix.rock.name }}
    needs:
      - discover-rocks
      - build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install required dependencies
        run: |
          sudo snap install rockcraft --classic --edge
          sudo snap install yq

      - name: Download built rock
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.rock.name }}-*
          merge-multiple: true

      - name: Import locally
        run: |
          ROCK_FILE=$(find . -type f -name '*.rock' | head -n1)
          if [ -z "$ROCK_FILE" ]; then
            echo 'No .rock package found in workspace'
            exit 1
          fi

          NAME=$(yq -r '.name' "${{ matrix.rock.path }}/rockcraft.yaml")
          IMAGE_REF="trivy/${NAME}:test"

          sudo rockcraft.skopeo --insecure-policy \
            copy \
            "oci-archive:${ROCK_FILE}" \
            "docker-daemon:${IMAGE_REF}"

          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "ROCK_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results-${{ matrix.rock.name }}.sarif
          severity: MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.rock.name }}.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          format: spdx-json
          output: dependency-results-${{ matrix.rock.name }}.sbom.json
          image-ref: ${{ env.IMAGE_REF }}
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          severity: MEDIUM,HIGH,CRITICAL
          scanners: vuln

      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-report-${{ matrix.rock.name }}
          path: dependency-results-${{ matrix.rock.name }}.sbom.json
          retention-days: 90
