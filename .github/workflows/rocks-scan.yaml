name: Rock Trivy Security Scanner

on:
  workflow_call:
    inputs:
      rocks:
        required: true
        type: string
      artifact-suffixes:
        default: '[""]'
        required: false
        type: string

jobs:
  scan:
    name: Trivy scan | ${{ matrix.rock.name }}${{ matrix.artifact-suffix == '' && '' || format(' | {0}', matrix.artifact-suffix) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(inputs.rocks) }}
        artifact-suffix: ${{ fromJSON(inputs.artifact-suffixes) }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install required dependencies
        run: |
          sudo snap install rockcraft --classic --edge
          sudo snap install yq

      - name: Download built rock
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifact-suffix == '' && format('{0}-*', matrix.rock.name) || format('{0}-{1}', matrix.rock.name, matrix.artifact-suffix) }}
          merge-multiple: true

      - name: Import locally
        run: |
          ROCK_FILE=$(find . -type f -name '*.rock' | head -n1)
          if [ -z "$ROCK_FILE" ]; then
            echo 'No .rock package found in workspace'
            exit 1
          fi

          NAME=$(yq -r '.name' "${{ matrix.rock.path }}/rockcraft.yaml")
          IMAGE_TAG="${{ matrix.artifact-suffix == '' && 'test' || matrix.artifact-suffix }}"
          IMAGE_REF="trivy/${NAME}:${IMAGE_TAG}"

          sudo rockcraft.skopeo --insecure-policy \
            copy \
            "oci-archive:${ROCK_FILE}" \
            "docker-daemon:${IMAGE_REF}"

          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "ROCK_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results-${{ matrix.rock.name }}-${{ matrix.artifact-suffix == '' && 'scan' || matrix.artifact-suffix }}.sarif
          severity: MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.rock.name }}-${{ matrix.artifact-suffix == '' && 'scan' || matrix.artifact-suffix }}.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          format: spdx-json
          output: dependency-results-${{ matrix.rock.name }}-${{ matrix.artifact-suffix == '' && 'scan' || matrix.artifact-suffix }}.sbom.json
          image-ref: ${{ env.IMAGE_REF }}
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          severity: MEDIUM,HIGH,CRITICAL
          scanners: vuln

      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-report-${{ matrix.rock.name }}-${{ matrix.artifact-suffix == '' && 'scan' || matrix.artifact-suffix }}
          path: dependency-results-${{ matrix.rock.name }}-${{ matrix.artifact-suffix == '' && 'scan' || matrix.artifact-suffix }}.sbom.json
          retention-days: 90
