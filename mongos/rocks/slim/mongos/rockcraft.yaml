name: mongos # the name of your rock
base: ubuntu@24.04 # the base environment for this rock
version: "8.0.23-10" # just for humans. Semantic versioning is recommended
summary: mongos in a rock. # 79 char long summary
description: |
  Mongos is the MongoDB sharded cluster query router.
  This snap packages the mongos daemon and related client
  utilities.
license: Apache-2.0
services:
  mongos:
    summary: Start mongos
    override: replace
    startup: enabled
    command: "/bin/bash /bin/start-mongos.sh"
run-user: _daemon_
platforms: # The platforms this rock should be built on and run on
  amd64:
  arm64:
parts:
  mongo-snap:
    plugin: nil
    stage-snaps:
      - mongos/8/edge
    stage-packages:
      - libssh-4
      - libbrotli1
      # Provides openssl for keyfile generation/rotation
      - openssl
  non-root-user:
    plugin: nil
    after: [mongo-snap]
    build-packages:
      - yq
    override-prime: |
      craftctl default

      conf="etc/mongod"
      mongos_config_file="${conf}/mongos.conf"

      mkdir -p $CRAFT_PRIME/$conf
      cp $CRAFT_STAGE/etc/mongod.conf "${mongos_config_file}"

      # mongos base config
      yq -i '.processManagement.fork = false' "${mongos_config_file}"
      yq -i '.processManagement.pidFilePath = "/var/run/mongos.pid"' \
        "${mongos_config_file}"
      yq -i '.security.keyFile = "/etc/mongod/mongodb-keyfile"' \
        "${mongos_config_file}"
      # Set the security placeholder in the right place
      sed -i '/^#security:$/d' "${mongos_config_file}"
      sed -i '/^security:$/i #security:' "${mongos_config_file}"
      yq -i '.net.port = 27018' "${mongos_config_file}"
      yq -i 'del(.storage)' "${mongos_config_file}"
      yq -i '.systemLog.path = "/var/log/mongodb/mongos.log"' \
        "${mongos_config_file}"

      rm -f "$CRAFT_PRIME/etc/mongod.conf"

      chown -R 584792:584792 "${conf}"

      install -d -o 584792 -g 584792 -m 770 \
        "$CRAFT_PRIME/var/log/mongodb" \
        "$CRAFT_PRIME/etc/mongod" \
        "$CRAFT_PRIME/run"

      # Data/log dirs are root-owned in the base; services run as _daemon_.
      chown -R 584792:584792 "$CRAFT_PRIME/var/log/mongodb"

      # The PID files are stored in `/var/run`
      mkdir -p "$CRAFT_PRIME/run"
      chown 584792:584792 "$CRAFT_PRIME/run"

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      ## for deb packages
      declare -a arr=()
      arr+=('${db:Status-Abbrev},')
      arr+=('${binary:Package},')
      arr+=('${Version},')
      arr+=('${source:Package},')
      arr+=('${Source:Version}\n')

      (echo "# os-release" && cat /etc/os-release) > ${rocks}/dpkg-query
      dpkg-query -f "${arr[*]}" -W >> ${rocks}/dpkg.query

      # for snap packages;
      cp snap.mongos/manifest.yaml ${rocks}
      cp snap.mongos/snapcraft.yaml ${rocks}
  rock-license:
    plugin: dump
    source: licenses
    organize:
      LICENSE-rock: licenses/LICENSE-rock
  entry:
    plugin: dump
    source: scripts
    organize:
      start-mongos.sh: bin/start-mongos.sh
      keyfile-common.sh: bin/keyfile-common.sh
      get-keyfile.sh: bin/get-keyfile
      set-keyfile.sh: bin/set-keyfile
    stage:
      - bin/start-mongos.sh
      - bin/keyfile-common.sh
      - bin/get-keyfile
      - bin/set-keyfile
