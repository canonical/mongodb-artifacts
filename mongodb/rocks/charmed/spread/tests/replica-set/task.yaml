summary: Replica set operator integration test

execute: |
  set -eux

  export PATH="/snap/bin:$PATH:$(pipx environment --value PIPX_BIN_DIR)"

  dump_debug() {
    set +e

    log_dir="$(dirname "$CRAFT_ARTIFACT")/spread-logs/replica-set"
    mkdir -p "$log_dir"

    juju status --relations --storage -m concierge-k8s:testing \
      > "$log_dir/juju-status.txt" 2>&1
    juju debug-log --replay --no-tail --date --utc \
      -m concierge-k8s:testing \
      > "$log_dir/juju-debug-log.txt" 2>&1
    {
      kubectl get pods --all-namespaces --output wide
      kubectl get events --all-namespaces --sort-by=.lastTimestamp
      kubectl describe pods --all-namespaces
    } > "$log_dir/k8s-state.txt" 2>&1

    # Managed-instance files are not automatically copied to the runner.
    # Print diagnostics so they survive in the CI and Rockcraft logs.
    {
      for pod in $(kubectl get pods -n testing -o name); do
        kubectl logs -n testing "$pod" --all-containers=true \
          --prefix=true --timestamps=true --tail=100
      done
    } > "$log_dir/workload-logs.txt" 2>&1

    {
      for pod in $(kubectl get pods -n testing -o name); do
        containers="$(kubectl get -n testing "$pod" \
          -o jsonpath='{.spec.containers[*].name}')"
        case " $containers " in
          *" mongod "*) ;;
          *) continue ;;
        esac
        printf "\nMongoDB network diagnostics: %s\n" "$pod"
        kubectl exec -n testing "$pod" -c mongod -- hostname
        kubectl exec -n testing "$pod" -c mongod -- \
          cat /etc/resolv.conf /etc/hosts /etc/mongod/mongod.conf
        # Juju gives StatefulSet pods a <pod>.<app>-endpoints hostname.
        pod_name="${pod#pod/}"
        app_name="${pod_name%-*}"
        kubectl exec -n testing "$pod" -c mongod -- \
          getent hosts "$pod_name.$app_name-endpoints"
      done
    } > "$log_dir/mongodb-network.txt" 2>&1

    for name in juju-status juju-debug-log k8s-state \
      workload-logs mongodb-network; do
      printf "\nDiagnostics: %s\n" "$name"
      cat "$log_dir/$name.txt"
    done
    printf "Spread diagnostics written to %s\n" "$log_dir"
  }

  cd "$SPREAD_PATH/operator"
  tox -e integration -- tests/integration/test_charm.py \
    --controller concierge-k8s --model testing || {
    exit_code="$?"
    dump_debug
    exit "$exit_code"
  }
