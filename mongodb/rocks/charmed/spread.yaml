project: charmed-mongodb

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:

suites:
  spread/tests/:
    summary: Charmed MongoDB rock operator integration tests
    prepare: |
      set -eux

      apt-get update
      apt-get install -y \
        build-essential \
        git \
        libldap-dev \
        libsasl2-dev \
        pipx \
        python3-dev \
        python3-pip \
        jq yq

      snap list charmcraft || snap install charmcraft --classic
      snap list concierge || snap install concierge --classic
      snap list rockcraft || snap install rockcraft --classic

      export PATH="/snap/bin:$PATH:$(pipx environment --value PIPX_BIN_DIR)"

      pipx install tox
      pipx ensurepath

      cd "$SPREAD_PATH"

      OPERATOR_BRANCH="8/edge"
      OPERATOR_REPO="https://github.com/canonical/mongodb-k8s-operator.git"

      ROCK_FILE="$(basename "$CRAFT_ARTIFACT")"
      ROCK_NAME="${ROCK_FILE%%_*}"
      ROCK_APP_VERSION="${ROCK_FILE#"${ROCK_NAME}_"}"
      ROCK_APP_VERSION="${ROCK_APP_VERSION%_*}"
      ROCK_VERSION="${ROCK_APP_VERSION%%-*}"
      ROCK_DIGEST="$(rockcraft.skopeo inspect \
        --format '{{.Digest}}' \
        "oci-archive:${CRAFT_ARTIFACT}")"
      ROCK_IMAGE_SOURCE="ghcr.io/canonical/${ROCK_NAME}@${ROCK_DIGEST}"

      git clone \
        --single-branch \
        --branch "$OPERATOR_BRANCH" \
        "$OPERATOR_REPO" \
        operator
      IMAGE_RESOURCE_PATH=".resources.\"mongodb-image\".\"upstream-source\""
      yq -i -Y \
        "${IMAGE_RESOURCE_PATH} = \"${ROCK_IMAGE_SOURCE}\"" \
        operator/metadata.yaml
      printf "%s\n" "$ROCK_VERSION" > operator/workload_version

      cd operator
      CRAFT_PLATFORM="ubuntu@24.04:$(dpkg --print-architecture)" \
        charmcraft pack --destructive-mode -v
    prepare-each: |
      set -eux

      export PATH="/snap/bin:$PATH:$(pipx environment --value PIPX_BIN_DIR)"
      export CONCIERGE_JUJU_CHANNEL="3.6/stable"
      export CONCIERGE_K8S_CHANNEL="1.35-classic/stable"

      # Match operator CI: Podman's CNI can assign early system pods to
      # 10.88.0.0/16 before Cilium is ready, breaking cluster connectivity.
      # Remove it before bootstrap so all pods use the Kubernetes CNI.
      rm -f /etc/cni/net.d/87-podman-bridge.conflist

      # The default pod CIDR overlaps Azure runner addresses (10.1.0.x).
      # Check explicit host routes before bootstrapping a fresh cluster.
      POD_CIDR=10.244.0.0/16
      export POD_CIDR

      snap list k8s || snap install k8s --classic \
        --channel="$CONCIERGE_K8S_CHANNEL"
      if ! k8s status >/dev/null 2>&1; then
        python3 -c '
      import ipaddress, json, os, subprocess
      network = ipaddress.ip_network(os.environ["POD_CIDR"])
      routes = json.loads(subprocess.check_output(
          ["ip", "-j", "-4", "route", "show", "table", "all"]))
      for route in routes:
          destination = route.get("dst", "default")
          if destination == "default":
              continue
          existing = ipaddress.ip_network(destination, strict=False)
          if network.overlaps(existing):
              raise SystemExit(f"Pod CIDR overlaps host route: {route}")
        '
        # Preserve Concierge's handling of preinstalled containerd.
        systemctl stop containerd.service || true
        if [ -S /run/containerd/containerd.sock ]; then
          rm -f /run/containerd/containerd.sock
        fi
        printf '%s\n' \
          "pod-cidr: $POD_CIDR" \
          'cluster-config:' \
          '  network: {enabled: true}' \
          '  dns: {enabled: true}' \
          '  local-storage: {enabled: true}' \
          '  gateway: {enabled: true}' \
          '  metrics-server: {enabled: true}' \
          > /tmp/mongodb-test-k8s-bootstrap.yaml
        k8s bootstrap --timeout 10m \
          --file /tmp/mongodb-test-k8s-bootstrap.yaml
      fi

      concierge prepare --trace -c "$SPREAD_PATH/operator/concierge.yaml"

      # Match the operator CI: node readiness precedes addon readiness.
      for resource in \
        deployment/cilium-operator \
        deployment/coredns \
        deployment/metrics-server \
        daemonset/cilium \
        daemonset/ck-storage-rawfile-csi-node \
        statefulset/ck-storage-rawfile-csi-controller; do
        if kubectl -n kube-system get "$resource" >/dev/null 2>&1; then
          kubectl -n kube-system rollout status "$resource" --timeout=5m
        else
          echo "Skipping rollout status for missing $resource"
        fi
      done

      # Fail before deployment if a regular pod cannot resolve services.
      kubectl run mongodb-test-dns --namespace testing \
        --image=busybox:1.36 --restart=Never \
        --command -- sleep 300
      dns_result=0
      kubectl wait -n testing --for=condition=Ready \
        pod/mongodb-test-dns --timeout=120s || dns_result=$?
      if [ "$dns_result" -eq 0 ]; then
        kubectl exec -n testing mongodb-test-dns -- \
          nslookup kubernetes.default.svc.cluster.local || dns_result=$?
        kubectl exec -n testing mongodb-test-dns -- nslookup \
          controller-service.controller-concierge-k8s.svc.cluster.local \
          || dns_result=$?
      fi
      kubectl get pods -A -o wide
      kubectl logs -n kube-system -l k8s-app=kube-dns \
        --all-containers=true --tail=50 --prefix=true || true
      kubectl delete pod -n testing mongodb-test-dns --wait=false
      if [ "$dns_result" -ne 0 ]; then
        echo "Cluster DNS preflight failed" >&2
        exit "$dns_result"
      fi

      juju set-model-constraints -m concierge-k8s:testing \
        arch="$(dpkg --print-architecture)"

      ROCK_FILE="$(basename "$CRAFT_ARTIFACT")"
      ROCK_NAME="${ROCK_FILE%%_*}"
      ROCK_DIGEST="$(rockcraft.skopeo inspect \
        --format '{{.Digest}}' \
        "oci-archive:${CRAFT_ARTIFACT}")"
      ROCK_IMAGE="ghcr.io/canonical/${ROCK_NAME}:spreadtest"
      ROCK_IMAGE_SOURCE="ghcr.io/canonical/${ROCK_NAME}@${ROCK_DIGEST}"

      # Import the OCI rock directly into Kubernetes's containerd namespace.
      /snap/k8s/current/bin/ctr \
        --address /run/containerd/containerd.sock \
        --namespace k8s.io images import \
        --digests --base-name "ghcr.io/canonical/${ROCK_NAME}" \
        "$CRAFT_ARTIFACT"
      # Import naming differs between containerd versions. Resolve the image
      # by manifest digest rather than assuming a digest-named tag exists.
      IMPORTED_IMAGE="$(/snap/k8s/current/bin/ctr \
        --address /run/containerd/containerd.sock \
        --namespace k8s.io images list | \
        awk -v digest="$ROCK_DIGEST" '$3 == digest {print $1; exit}')"
      if [ -z "$IMPORTED_IMAGE" ]; then
        echo "Imported rock image not found for digest $ROCK_DIGEST" >&2
        exit 1
      fi
      /snap/k8s/current/bin/ctr \
        --address /run/containerd/containerd.sock \
        --namespace k8s.io images tag \
        --force \
        "$IMPORTED_IMAGE" \
        "$ROCK_IMAGE_SOURCE" \
        "$ROCK_IMAGE"
    restore-each: |
      export PATH="/snap/bin:$PATH:$(pipx environment --value PIPX_BIN_DIR)"

      juju destroy-model \
        --force \
        --no-wait \
        --destroy-storage \
        --no-prompt \
        concierge-k8s:testing || true
      juju kill-controller --no-prompt concierge-k8s || true

exclude:
  - .git
  - .tox
  - operator

kill-timeout: 3h
