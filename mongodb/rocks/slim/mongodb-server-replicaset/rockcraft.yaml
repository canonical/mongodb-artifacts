name: mongodb-server-replicaset # the name of your rock
base: ubuntu@24.04 # the base environment for this rock
version: "8.0.10-4" # just for humans. Semantic versioning is recommended
summary: Replica set MongoDB server in a rock. # 79 char long summary
description: |
  Replica set MongoDB server packages a replica set MongoDB topology,
  including mongod and administration tools.
license: Apache-2.0 # your application's SPDX license
services:
  mongod:
    summary: Start mongod
    override: replace
    startup: enabled
    command: "/bin/bash /bin/start-mongod.sh"

platforms: # The platforms this rock should be built on and run on
  amd64:
  arm64:

parts:
  mongo-snap:
    plugin: nil
    stage-snaps:
      - mongodb-server-replicaset/8/edge
      - yq
    overlay-packages:
      - ca-certificates
    stage-packages:
      - libssh-4
      - libbrotli1
      # Provides openssl for keyfile generation/rotation
      - openssl
  non-root-user:
    plugin: nil
    after: [mongo-snap]
    override-overlay: |
      groupadd -g  584788 mongodb
      useradd -M -r -g mongodb -u 584788 mongodb
    override-prime: |
      craftctl default

      conf="etc/mongod"
      mongo_config_file="${conf}/mongod.conf"
      mongos_config_file="${conf}/mongos.conf"

      mkdir -p $CRAFT_PRIME/$conf
      cp $CRAFT_STAGE/etc/mongod.conf "${mongo_config_file}"

      # Common mongod base config
      yq -i '.processManagement.fork = false' "${mongo_config_file}"
      yq -i '.security.keyFile = "/etc/mongod/mongodb-keyfile"' \
        "${mongo_config_file}"
      # Set the security placeholder in the right place
      sed -i '/^#security:$/d' "${mongo_config_file}"
      sed -i '/^security:$/i #security:' "${mongo_config_file}"

      rm -f "$CRAFT_PRIME/etc/mongod.conf"

      chown -R 584788:584788 "${conf}"

      # Data/log dirs are root-owned in the base; services run as uid 584788.
      chown -R 584788:584788 \
        "$CRAFT_PRIME/var/lib/mongodb" "$CRAFT_PRIME/var/log/mongodb"

      # The PID files are stored in `/var/run`
      mkdir -p "$CRAFT_PRIME/run"
      chown 584788:584788 "$CRAFT_PRIME/run"

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      ## for deb packages
      declare -a arr=()
      arr+=('${db:Status-Abbrev},')
      arr+=('${binary:Package},')
      arr+=('${Version},')
      arr+=('${source:Package},')
      arr+=('${Source:Version}\n')

      (echo "# os-release" && cat /etc/os-release) > ${rocks}/dpkg-query
      dpkg-query -f "${arr[*]}" -W >> ${rocks}/dpkg.query

      # for snap packages;
      cp snap.mongodb-server-replicaset/manifest.yaml ${rocks}
      cp snap.mongodb-server-replicaset/snapcraft.yaml ${rocks}

  rock-license:
    plugin: dump
    source: licenses
    organize:
      LICENSE-rock: licenses/LICENSE-rock
      usr/share/doc/logrotate/copyright: licenses/COPYRIGHT-logrotate

  entry:
    plugin: dump
    source: scripts
    organize:
      start-mongod.sh: bin/start-mongod.sh
      keyfile-common.sh: bin/keyfile-common.sh
      get-keyfile.sh: bin/get-keyfile
      set-keyfile.sh: bin/set-keyfile
    stage:
      - bin/start-mongod.sh
      - bin/keyfile-common.sh
      - bin/get-keyfile
      - bin/set-keyfile
