name: mongodb-server-replicaset
title: MongoDB
base: core24 # the base snap is the execution environment for this snap
version: "8.0.23-10" # just for humans, typically '1.2+git' or '1.3.2'
summary: MongoDB server for replicasets in a snap. # 79 char long summary
description: |
  MongoDB is a source-available, cross-platform document database.
  This snap packages MongoDB server, shell, and command-line tools
  into a self-contained, strictly confined Ubuntu snap.
license: Apache-2.0
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
platforms:
  amd64:
  arm64:
website: https://github.com/canonical/mongodb-artifacts
contact: https://github.com/canonical/mongodb-artifacts/issues/new
issues: https://github.com/canonical/mongodb-artifacts/issues/new
system-usernames:
  snap_daemon: shared
hooks:
  install:
    plugs:
      - network
      - network-bind
package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: https://ppa.launchpadcontent.net/data-platform/charmed-mongodb-8/ubuntu
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: |
      https://ppa.launchpadcontent.net/data-platform/mongodb-shell/ubuntu
plugs:
  mongosh-posix-mq:
    interface: posix-mq
    posix-mq: mongosh
slots:
  logs:
    interface: content
    source:
      read:
        - $SNAP_COMMON/var/log/mongodb
  mongosh-posix-mq-provider:
    interface: posix-mq
    posix-mq: mongosh
    path: /mongosh
    permissions:
      - read
apps:
  get-keyfile:
    command: get-keyfile.sh
  set-keyfile:
    command: set-keyfile.sh
  mongosh:
    command: drop_priv.sh mongosh
    environment:
      HOME: $SNAP_DATA/home
      XDG_CACHE_HOME: $SNAP_DATA/home/.cache
      XDG_CONFIG_HOME: $SNAP_DATA/home/.config
    plugs:
      - mongosh-posix-mq
      - network
      - system-observe
  mongobridge:
    command: drop_priv.sh mongobridge
    environment:
      SSL_CERT_FILE: $SNAP/etc/ssl/certs/ca-certificates.crt
    plugs:
      - hardware-observe
      - network
      - network-bind
      - network-observe
      - system-observe
  mongod-cli:
    command: drop_priv.sh mongod
    plugs:
      - hardware-observe
      - network
      - network-bind
      - network-observe
      - system-observe
    slots:
      - logs
  mongod:
    command: start-mongod.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    plugs:
      - hardware-observe
      - network
      - network-bind
      - network-observe
      - system-observe
    slots:
      - logs
  # MongoDB Tools
  mongodump:
    command: drop_priv.sh mongodump
    plugs:
      - network
      - network-bind
  mongoexport:
    command: drop_priv.sh mongoexport
    plugs:
      - network
  mongofiles:
    command: drop_priv.sh mongofiles
    plugs:
      - network
  mongoimport:
    command: drop_priv.sh mongoimport
    plugs:
      - network
  mongorestore:
    command: drop_priv.sh mongorestore
    plugs:
      - network
      - network-bind
  mongostat:
    command: drop_priv.sh mongostat
    plugs:
      - network
  mongotop:
    command: drop_priv.sh mongotop
    plugs:
      - network
parts:
  mongodb-license:
    plugin: nil
    stage-packages:
      - percona-server-mongodb
    override-prime: |
      mkdir -p $CRAFT_PRIME/licenses
      LICENSE_LOC=usr/share/doc/percona-server-mongodb
      zcat $CRAFT_STAGE/$LICENSE_LOC/LICENSE-Community.txt.gz \
        > $CRAFT_PRIME/licenses/LICENSE-percona-server
    prime:
      - licenses/LICENSE-percona-server
  mongodb-deb:
    plugin: nil
    stage-packages:
      - percona-server-mongodb-tools
      - percona-server-mongodb-server
      - mongodb-shell
      - util-linux
      - openssl
      - libsasl2-modules
      - libgssapi-krb5-2
      - jq
      - yq
    organize:
      usr/share/doc/mongodb-shell/copyright: licenses/LICENSE-mongodb-shell
  wrapper:
    plugin: dump
    source: snap/local
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
