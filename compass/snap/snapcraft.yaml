name: mongodb-compass
title: MongoDB Compass
base: core26 # the base snap is the execution environment for this snap
adopt-info: mongodb-compass
summary: MongoDB Compass in a snap. # 79 char long summary
description: |
  MongoDB Compass lets builders explore their data, run queries and aggregations,
  and refine their data models through an easy-to-use visual interface.
license: Apache-2.0
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
compression: lzo
type: app
platforms:
  amd64:
  arm64:
website: https://github.com/canonical/mongodb-artifacts
contact: https://github.com/canonical/mongodb-artifacts/issues/new
issues: https://github.com/canonical/mongodb-artifacts/issues/new
source-code: https://github.com/canonical/mongodb-artifacts/tree/8-24.04/edge/compass
plugs:
  compass-posix-mq:
    interface: posix-mq
    posix-mq: compass
  shmem:
    interface: shared-memory
    private: true
slots:
  compass-posix-mq-provider:
    interface: posix-mq
    posix-mq: compass
    path: /compass
    permissions:
      - read
layout:
  /etc/mongodb-compass.conf:
    bind-file: $SNAP_DATA/etc/mongodb-compass.conf

apps:
  mongodb-compass:
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
      GTK_USE_PORTAL: "1"
    desktop: usr/share/applications/mongodb-compass.desktop
    command: launcher.sh
    extensions: [gpu]
    plugs:
      - browser-support
      - compass-posix-mq
      - desktop
      - desktop-legacy
      - network
      - network-bind
      - shmem
      - system-observe
      - wayland
      - x11
      - password-manager-service
      - gsettings
parts:
  wrapper:
    plugin: dump
    source: snap/local
    prime:
      - launcher.sh
      - etc/mongodb-compass.conf
      - -fonts
    organize:
      mongodb-compass.conf: etc/mongodb-compass.conf
  mongodb-compass:
    after:
      - wrapper
    plugin: nil
    source: https://git.launchpad.net/~data-platform/mongodb-compass/+git/compass
    source-type: git
    source-tag: v1.50.0
    build-packages:
      - cmake
      - libkrb5-dev
      - libmongocrypt0
      - sed
      - unzip
    build-snaps:
      - node/24/stable
    build-environment:
      - HADRON_DISTRIBUTION: compass
      - CSFLE_LIB_PATH: "packages/compass/src/deps/csfle/lib"
    stage-packages:
      - libsecret-1-0
      - libsecret-tools
      - gnome-keyring
      - fonts-freefont-ttf
      - util-linux
      - openssl
      - libnss3
      - libnspr4
      - libgbm1
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libgtk-3-0t64
      - libpango-1.0-0
      - libxcb-shm0
      - libxcb1
      - libx11-6
      - libasound2t64
      - libgl1
      - libglvnd0
      - libglx0
      - libadwaita-1-0
    override-build: |
      echo "process.exit(0)" > packages/compass/scripts/download-csfle.js
      echo "process.exit(0)" > packages/compass/scripts/download-fonts.js

      mkdir -p ${CSFLE_LIB_PATH}
      cp /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libmongocrypt.so.0 ${CSFLE_LIB_PATH}/mongo_crypt_v1.so

      cp ${CRAFT_STAGE}/fonts/*.woff packages/compass/src/app/fonts/
      cp ${CRAFT_STAGE}/fonts/*.woff2 packages/compass/src/app/fonts/
      cp ${CRAFT_STAGE}/fonts/fonts.less packages/compass/src/app/styles/fonts.less
      
      npm run bootstrap
      npm run package-compass
    
      # Get version from tag
      VERSION=$(git describe --tags --abbrev=10 | tr -d v) 

      craftctl set version=${VERSION}

      dpkg -x packages/compass/dist/mongodb-compass_${VERSION}_${CRAFT_ARCH_BUILD_FOR}.deb ${CRAFT_PART_INSTALL}
      sed -i 's|Icon=mongodb-compass|Icon=/usr/share/pixmaps/mongodb-compass.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/mongodb-compass.desktop

      craftctl default
    organize:
      usr/share/doc/mongodb-compass/copyright: licenses/LICENSE-mongodb-compass 
    prime:
      - usr
      - -usr/lib/mongodb-compass/chrome-sandbox
  patch-desktop-file-name:
    after: [mongodb-compass]
    source: https://github.com/snapcrafters/patch-desktop-file-name.git
    source-subdir: electron
    plugin: nil
    override-build: |
      pip install asarPy --break-system-packages
      python3 $CRAFT_PART_SRC_WORK/patch-desktop-filename.py $CRAFT_STAGE/usr/lib/mongodb-compass/resources/app.asar
  zenity:
    plugin: nil
    stage-packages:
      - zenity
    prime:
      - usr/bin/zenity
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
